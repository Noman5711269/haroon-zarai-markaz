<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" stroke="#facc15" stroke-width="6" filter="url(#shadow)" />

  <!-- Center Decorative Ring -->
  <circle cx="256" cy="240" r="165" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.8" />
  <circle cx="256" cy="240" r="150" fill="#04392b" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Stylized Golden Wheat Stalk (Center) -->
  <g id="wheat" filter="url(#shadow)">
    <!-- Central Stem -->
    <path d="M256 120 L256 340" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
    
    <!-- Top Crown Grain -->
    <path d="M256 100 C246 115 246 135 256 145 C266 135 266 115 256 100 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />

    <!-- Left & Right Wheat Grains -->
    <!-- Level 1 -->
    <path d="M256 145 C225 135 210 155 225 175 C242 170 252 158 256 145 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
    <path d="M256 145 C287 135 302 155 287 175 C270 170 260 158 256 145 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />

    <!-- Level 2 -->
    <path d="M256 180 C215 170 200 195 218 215 C238 210 250 195 256 180 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
    <path d="M256 180 C297 170 312 195 294 215 C274 210 262 195 256 180 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />

    <!-- Level 3 -->
    <path d="M256 220 C215 210 200 235 218 255 C238 250 250 235 256 220 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
    <path d="M256 220 C297 210 312 235 294 255 C274 250 262 235 256 220 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />

    <!-- Level 4 -->
    <path d="M256 260 C222 252 210 275 225 292 C242 288 252 274 256 260 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
    <path d="M256 260 C290 252 302 275 287 292 C270 288 260 274 256 260 Z" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
  </g>

  <!-- Lower Banner with Urdu Text -->
  <rect x="80" y="380" width="352" height="75" rx="20" ry="20" fill="#042f24" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />
  <text x="256" y="428" font-family="'Noto Nastaliq Urdu', 'Gulzar', sans-serif" font-size="34" font-weight="bold" fill="#facc15" text-anchor="middle">
    ہارون زرعی مرکز
  </text>
</svg>
